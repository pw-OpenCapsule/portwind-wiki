# Dogfood: 每次 portwind-wiki 发 GitHub Release，自动在飞书 wiki
# Skill 沉淀 / portwind-wiki 节点下建一个 release notes 子文档。
#
# 这正是 portwind-wiki 自身推荐的「Release 自动同步」模式，参考
# references/release-automation.md。
#
# 前置（一次性 setup）：
#   - GitHub repo secrets: LARK_APP_ID + LARK_APP_SECRET
#   - 飞书开放平台的 app 必须开启以下 scope:
#       wiki:node:retrieve, wiki:node:create, wiki:node:read,
#       wiki:space:read, docx:document:readonly, docx:document:write_only
#   - bot 已被加进飞书 wiki 空间作为编辑协作者
#
# 触发：每次 GitHub Release publish 或 edit。幂等 — 同 tag 重发不会建多个节点。

name: Sync release notes to Lark wiki

on:
  release:
    types: [published, edited]

env:
  # portwind-wiki 在飞书 wiki 里自己的节点 — release notes 建在它下面
  WIKI_PARENT_NODE: CpEjwWGavio9G0kK5w2jtordpqg
  WIKI_SPACE_ID:    '7642234757744496151'

jobs:
  publish-release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Install lark-cli
        run: npx @larksuite/cli@latest install

      - name: Resolve / create wiki child for ${{ github.event.release.tag_name }}
        id: wiki
        env:
          LARKSUITE_CLI_APP_ID:     ${{ secrets.LARK_APP_ID }}
          LARKSUITE_CLI_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARKSUITE_CLI_BRAND:      lark
          LARKSUITE_CLI_NO_UPDATE_NOTIFIER: '1'
          TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_NAME:-}" ] && [ "${RELEASE_NAME}" != "${TAG}" ]; then
            TITLE="${RELEASE_NAME}"
          else
            TITLE="${TAG}"
          fi
          echo "title=${TITLE}"

          EXISTING=$(lark-cli wiki nodes list \
            --params "{\"space_id\":\"${WIKI_SPACE_ID}\",\"parent_node_token\":\"${WIKI_PARENT_NODE}\"}" \
            --as user 2>/dev/null \
            | jq -r --arg t "$TITLE" '.data.items[] | select(.title==$t) | .obj_token' | head -1)

          if [ -n "${EXISTING:-}" ]; then
            echo "Found existing child: $EXISTING — will overwrite"
            DOC_TOKEN="$EXISTING"
          else
            echo "No existing child — creating"
            DOC_TOKEN=$(lark-cli wiki +node-create \
              --space-id "$WIKI_SPACE_ID" \
              --parent-node-token "$WIKI_PARENT_NODE" \
              --title "$TITLE" \
              --obj-type docx \
              --node-type origin \
              --as user 2>&1 \
              | jq -r '.data.obj_token')
          fi

          if [ -z "${DOC_TOKEN:-}" ] || [ "$DOC_TOKEN" = "null" ]; then
            echo "::error::failed to resolve doc_token for $TITLE"
            exit 1
          fi
          echo "DOC_TOKEN=$DOC_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Push release body to wiki doc
        env:
          LARKSUITE_CLI_APP_ID:     ${{ secrets.LARK_APP_ID }}
          LARKSUITE_CLI_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARKSUITE_CLI_BRAND:      lark
          LARKSUITE_CLI_NO_UPDATE_NOTIFIER: '1'
          TAG:  ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
          URL:  ${{ github.event.release.html_url }}
          DOC_TOKEN: ${{ steps.wiki.outputs.DOC_TOKEN }}
        run: |
          set -euo pipefail
          cat > /tmp/release-body.md <<EOF
          # ${TAG}

          > Source: [GitHub Release ${TAG}](${URL})

          ${BODY}
          EOF
          lark-cli docs +update --api-version v2 \
            --doc "$DOC_TOKEN" \
            --command overwrite \
            --doc-format markdown \
            --content "$(cat /tmp/release-body.md)" \
            --as user
